# ZB SOFTWARE — Pharmacy POS & Inventory System — packaging configuration (electron-builder)
appId: com.zbsoftware.pharmacypos
productName: ZB Pharmacy POS
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - electron/**
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ZB Pharmacy POS
  artifactName: ZB-Pharmacy-POS-Setup-${version}.${ext}
portable:
  artifactName: ZB-Pharmacy-POS-Portable-${version}.${ext}
